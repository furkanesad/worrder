<title>Kalıp Kartları</title>

<style>
/* Layout: tek ekran — üstte üç kontrol (karıştır, seviye, kart sayısı), ortada kaydırmalı kart yığını, altta sayaç */
:root{--bg:#EEF1F6;--surface:#FFFFFF;--ink:#172033;--muted:#59647A;--rule:#DDE3EC;--accent:#2346C8;--onc:#FFFFFF;
 --k0:#2346C8;--k1:#2E7D32;--k2:#C2185B;--k3:#C25E00;--k4:#6A3FB5;
 --tr:"Figtree",-apple-system,"Segoe UI",system-ui,sans-serif;--jp:"Hiragino Sans","Yu Gothic","Noto Sans JP",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F141D;--surface:#182030;--ink:#E6EBF3;--muted:#9AA5B8;--rule:#2B3547;--accent:#8FA8FF;--onc:#10141B;--k0:#8FA8FF;--k1:#86C98A;--k2:#F48FB1;--k3:#FFB26B;--k4:#C3A6FF;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F141D;--surface:#182030;--ink:#E6EBF3;--muted:#9AA5B8;--rule:#2B3547;--accent:#8FA8FF;--onc:#10141B;--k0:#8FA8FF;--k1:#86C98A;--k2:#F48FB1;--k3:#FFB26B;--k4:#C3A6FF;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--tr);padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow:hidden}
button,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;height:100%;display:flex;flex-direction:column;gap:10px;padding:14px 0 calc(12px + env(safe-area-inset-bottom,0px))}
.bar{display:flex;gap:8px;align-items:center;flex:none}
.bar h1{margin:0;font-size:1.1rem;font-weight:800;display:flex;align-items:center;gap:6px;margin-right:auto;white-space:nowrap}
.bar h1 span{font-family:var(--jp);color:var(--k2)}
.sel{position:relative;display:inline-flex;align-items:center;border:1px solid var(--rule);background:var(--surface);border-radius:10px;padding:0 8px 0 10px;height:38px;font-weight:600;font-size:.9rem;gap:4px}
.sel small{color:var(--muted);font-weight:500;font-size:.72rem}
.sel select{border:0;background:transparent;font-weight:700;padding:0 2px;height:100%;cursor:pointer;max-width:110px}
#cat{max-width:120px}
.mix{border:0;background:var(--accent);color:var(--onc);border-radius:10px;height:38px;padding:0 14px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px;flex:none}
.mix:active{transform:scale(.97)}
.stage{position:relative;flex:1;min-height:260px;overflow:clip;margin:0 -4px;padding:0 4px}
.card{position:absolute;inset:0 2px 10px;perspective:1400px;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;will-change:transform}
.card.n1{transform:translateY(10px) scale(.96);opacity:.8;pointer-events:none}
.card.n2{transform:translateY(20px) scale(.92);opacity:.55;pointer-events:none}
.card.cur{z-index:3;cursor:grab;transition:transform .28s cubic-bezier(.2,.7,.3,1)}
.card.cur.drag{transition:none;cursor:grabbing}
.card.cur.enter{transform:translateY(10px) scale(.96)}
.card.fly{transition:transform .26s ease-in,opacity .26s ease-in}
.inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .45s cubic-bezier(.3,.7,.25,1)}
.card.flipped .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--surface);border:1px solid var(--rule);border-radius:22px;box-shadow:0 10px 30px -12px rgba(20,30,60,.35);display:flex;flex-direction:column;overflow:hidden}
.face::before{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:var(--kc)}
.back{transform:rotateY(180deg)}
.top{display:flex;align-items:center;gap:8px;padding:14px 16px 4px;font-size:.75rem;color:var(--muted);flex:none}
.top .kch{font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--kc);background:color-mix(in srgb,var(--kc) 14%,var(--surface));border-radius:6px;padding:2px 8px;font-family:var(--jp)}
.top .lv{margin-left:auto;font-weight:700;border:1px solid var(--lc);color:var(--lc);border-radius:999px;padding:0 8px}
.mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:8px 18px;text-align:center;min-height:0;overflow:hidden}
.w{font-family:var(--jp);font-size:clamp(1.5rem,7vw,2.1rem);line-height:1.5;font-weight:600;overflow-wrap:anywhere}
.m{font-size:clamp(1rem,4.2vw,1.25rem);font-weight:700;color:var(--muted)}
.tap{text-align:center;font-size:.76rem;color:var(--muted);padding:0 0 14px;flex:none}
.scroll{flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:4px 16px 16px;touch-action:none}
.scroll.can{touch-action:pan-y}
.bh{display:flex;flex-direction:column;gap:2px;margin:2px 0 10px}
.bh .w{font-size:1.35rem;text-align:left}.bh .m{font-size:.95rem;text-align:left}
.use{font-size:.88rem;margin:0 0 8px}
.rows{list-style:none;margin:0 0 10px;padding:0;display:flex;flex-direction:column;gap:6px}
.rows li{background:var(--bg);border-radius:10px;padding:8px 10px;display:grid;grid-template-columns:auto 1fr;gap:2px 8px}
.rows .n{width:22px;height:22px;border-radius:50%;border:2px solid var(--kc);color:var(--kc);display:grid;place-items:center;font-size:.72rem;font-weight:700;grid-row:span 2}
.rows .fm{font-family:var(--jp);font-size:1.02rem}
.rows .fm .slot{color:var(--muted)}.rows .fm .key{color:var(--kc);text-decoration:underline;text-underline-offset:4px;font-weight:700}
.rows .lb{font-size:.78rem;font-weight:600;color:var(--onc);background:var(--kc);border-radius:4px;padding:1px 8px;justify-self:start}
.rows .tr{grid-column:2;font-size:.8rem;color:var(--muted)}
.ex{border-left:3px solid var(--kc);padding:2px 0 2px 10px;margin:6px 0}
.ex .jp{font-family:var(--jp);font-size:1.05rem;line-height:2;margin:0}.ex .jp u{text-decoration-color:var(--kc);text-decoration-thickness:2px;text-underline-offset:3px}
.ex .tr{font-size:.85rem;color:var(--muted);margin:0}
.ksub{font-size:.7rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:12px 0 4px}
.rules{margin:0;padding-left:18px;font-size:.88rem;display:flex;flex-direction:column;gap:4px}
.err{font-size:.88rem;background:var(--bg);border-radius:10px;padding:8px 10px}.err s{color:#D64545}.err b{color:#2E9D5B}
.foot{display:flex;align-items:center;gap:10px;font-size:.84rem;color:var(--muted);flex:none;flex-wrap:wrap}
.foot b{color:var(--ink);font-variant-numeric:tabular-nums}
.foot .hint{margin-left:auto;font-size:.76rem}
.dots{display:flex;gap:3px;flex:1;min-width:60px}
.dots i{flex:1;height:4px;border-radius:2px;background:var(--rule)}
.dots i.on{background:var(--accent)}
.toast{position:fixed;left:50%;top:calc(68px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);font-weight:700;font-size:.9rem;padding:8px 16px;border-radius:999px;z-index:20;box-shadow:0 6px 20px rgba(0,0,0,.2);pointer-events:none;opacity:0;transition:opacity .25s}
.toast.show{opacity:1}
.empty{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);text-align:center;padding:20px}
.c0{--kc:var(--k0)}.c1{--kc:var(--k1)}.c2{--kc:var(--k2)}.c3{--kc:var(--k3)}.c4{--kc:var(--k4)}
@media (prefers-reduced-motion:reduce){.inner,.card,.card.fly{transition:none!important}}
@media (max-width:480px){.bar h1 b{display:none}.sel small{display:none}.sel{padding:0 2px 0 6px}.mix span{display:none}.mix{padding:0 10px}#cat{max-width:88px}#lv{max-width:70px}#n{max-width:62px}}
</style>

<div class="wrap">
  <div class="bar">
    <h1><span>型</span><b>Kalıp Kartları</b></h1>
    <label class="sel"><small>Konu</small><select id="cat" aria-label="Konu"><option value="all">Hepsi</option></select></label>

 kalıbı: 〜がおすすめです / 〜はいかがですか.","どちらが → cevap 〜のほうが.","Şart ekle: 辛くないもので, 安いもので, 子ども向けで."],"use":"Restoranda, mağazada, turizm ofisinde seçim yaparken yardım isterken.","err":["何が一番いいですか。（sert）","おすすめは何ですか。","Personelle おすすめ kalıbı daha doğal."]},{"id":"s_apology_levels","lv":"N4","cat":14,"t":[["ごめん／ごめんなさい","pardon / özür dilerim (samimi)"],["すみません(でした)","özür dilerim (standart)"],["申し訳ありません／ございません","çok özür dilerim (resmî)"]],"rows":[["〈ごめん〉／〈ごめんね〉／〈ごめんなさい〉","Pardon / kusura bakma","Arkadaş, aile."],["〈すみません〉／〈すみませんでした〉","Özür dilerim / Özür dilerdim (geçmiş)","Her yerde; geçmiş için でした."],["〈申し訳ありません〉／〈申し訳ございません〉","Çok özür dilerim","Müşteri, üst, resmî."]],"ex":[["〈ごめん〉、[遅|おく]れた！","Pardon, geç kaldım!"],["[昨日|きのう]は〈すみませんでした〉。","Dün için özür dilerim."],["ご[迷惑|めいわく]をおかけして、〈申し訳ございません〉。","Rahatsızlık verdiğim için çok özür dilerim."]],"r":["すみません üç iş: özür, dikkat çekme (Pardon!), teşekkür (zahmet verdim).","Geçmişte olan şey için すみませんでした / 申し訳ありませんでした.","Derinleştirme: 本当に / 大変 + 申し訳ございません; eğilerek söylenir."],"use":"Her tür özürde doğru seviyeyi seçerken.","err":["（müşteriye）ごめんなさい。","申し訳ございません。","Müşteriye resmî özür."]},{"id":"s_disagree_softly","lv":"N3","cat":15,"t":[["〜のはどうでしょうか","… nasıl olur? (yumuşak itiraz)"],["そうですね、でも","evet ama (yumuşak)"],["〜かもしれませんが","… olabilir ama"]],"rows":[["［öneri］〈のはどうでしょうか〉","… yapmak nasıl olur?","Karşı öneriyi soru gibi sunma."],["〈そうですね〉、〈でも〉［itiraz］","Evet öyle, ama …","Önce kabul, sonra itiraz."],["［karşı görüş］〈かもしれませんが〉、［kendi görüşün］","… olabilir ama …","Karşı tarafı yumuşatma."]],"ex":[["〈そうですね〉。〈でも〉、[予算|よさん]がちょっと…","Haklısınız. Ama bütçe biraz…"],["[先|さき]に[値段|ねだん]を[確認|かくにん]する〈のはどうでしょうか〉。","Önce fiyatı kontrol etsek nasıl olur?"],["[難|むずか]しい〈かもしれませんが〉、やってみる[価値|かち]はあると[思|おも]います。","Zor olabilir ama denemeye değer bence."]],"r":["Japoncada doğrudan いいえ nadir; “evet, ama…” ve “… nasıl olur?” standart.","ちょっと… cümleyi bitirmeden bırakmak = kibar hayır.","〜と思います eklemek görüşü yumuşatır."],"use":"Toplantıda, grup planında ya da pazarlıkta nazikçe karşı çıkarken.","err":["それは違います。","そうですね。でも、少し違う意見なんですが…","Doğrudan ret yerine yumuşatma."]},{"id":"s_smalltalk_weather","lv":"N5","cat":15,"t":[["いい天気ですね","Hava güzel, değil mi"],["暑いですね／寒いですね","Sıcak / soğuk, değil mi"],["〜になりましたね","… oldu artık, değil mi"]],"rows":[["〈いい天気ですね〉","Güzel hava, değil mi?","Sohbet açıcı #1."],["〈暑いですね〉／〈寒いですね〉／〈蒸し暑いですね〉","Sıcak / soğuk / bunaltıcı, değil mi?","Mevsime göre."],["［mevsim/durum］〈になりましたね〉","… oldu, değil mi?","Değişimi paylaşma."]],"ex":[["〈いい天気ですね〉。 — そうですね、[散歩|さんぽ][日和|びより]ですね。","Hava güzel, değil mi? — Evet, tam yürüyüş havası."],["[今日|きょう]は〈蒸し暑いですね〉。 — [本当|ほんとう]に。[梅雨|つゆ]ですからね。","Bugün çok bunaltıcı, değil mi? — Gerçekten. Yağmur mevsimi ya."],["すっかり[秋|あき]〈になりましたね〉。","İyice sonbahar oldu, değil mi?"]],"r":["ね ile bitir, karşı taraf そうですね der → sohbet açılır.","Hava sohbeti Japonya'da selamlaşmanın parçası; cevap vermemek soğuk durur.","Mevsim kelimeleri: 梅雨 (yağmur mevsimi), 花見 (kiraz), 紅葉 (güz yaprakları), 大雪 (kar)."],"use":"Asansörde, komşuyla, iş yerinde sohbet açarken.","err":["今日は天気がいいです。（ね yok）","いい天気ですね。","ね paylaşım için şart."]},{"id":"n1_narade_wa","lv":"N1","cat":12,"t":[["〜ならでは","ancak …e özgü"],["〜をおいて(ほかに)","…den başka (yok)"],["〜にほかならない","…dan başka bir şey değil"]],"rows":[["［N］〈ならでは〉の N","…e has, sadece …de olan","Övgü, tanıtım dili."],["［N］〈をおいて〉ほかに〜ない","…den başkası olamaz","Tek seçenek."],["［N］〈にほかならない〉","tam olarak …dır","Kesin tanım (yazı)."]],"ex":[["[京都|きょうと]〈ならでは〉の[景色|けしき]ですね。","Kyoto'ya özgü bir manzara."],["[地元|じもと]〈ならでは〉の[料理|りょうり]を[楽|たの]しんでください。","Yöreye özgü yemeklerin tadını çıkarın."],["この[仕事|しごと]ができるのは、[彼|かれ]〈をおいて〉ほかにいない。","Bu işi yapabilecek ondan başkası yok."]],"r":["ならでは tanıtım broşürlerinde çok: 日本ならでは, 冬ならでは.","をおいて hep ほかに〜ない ile.","にほかならない yazı dili; konuşmada まさに〜だ."],"use":"Bir şeyin sadece o yere/kişiye özgü olduğunu vurgularken (tanıtım, övgü).","err":["京都ならでは景色。","京都ならではの景色。","ならでは + の + N."]},{"id":"n1_zuniwa_irarenai","lv":"N1","cat":11,"t"   const reduce = () => matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  const kRuby = s => esc(s).replace(/\[([^|\]]+)\|([^\]]+)\]/g, '<ruby>$1<rt>$2</rt></ruby>').replace(/〈/g, '<u>').replace(/〉/g, '</u>');
  const fmtF = f => esc(f).replace(/［([^］]*)］/g, '<span class="slot">［$1］</span>').replace(/〈([^〉]*)〉/g, '<b class="key">$1</b>');
  const catCls = ci => 'c' + (ci % 5);

  const opt = Object.assign({lv:'all', n:20, cat:'all'}, ls.get('opt', {}));
  $('cat').innerHTML = '<option value="all">Hepsi</option>' + CATS.map((k, i) => `<option value="${i}">${esc(k[2])} ${esc(k[1])}</option>`).join('');
  $('lv').value = opt.lv; $('n').value = String(opt.n); $('cat').value = String(opt.cat);
  let deck = [], pos = 0, round = 1, flipped = false, busy = false;
  let toastT;
  function toast(t){ const el = $('toast'); el.textContent = t; el.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('show'), 1500); }
  function shuffle(a){ const b = a.slice(); for (let i = b.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; }
  function newDeck(msg){
    const pool = CARDS.filter(c => (opt.lv === 'all' || c.lv === opt.lv) && (opt.cat === 'all' || c.cat === +opt.cat));
    deck = shuffle(pool); if (opt.n > 0) deck = deck.slice(0, opt.n);
    pos = 0; round = 1; flipped = false;
    render(true); if (msg) toast(msg);
  }
  function topRow(c){ return `<div class="top"><span class="kch">${esc(CATS[c.cat][2])} ${esc(CATS[c.cat][1])}</span><span class="lv" style="--lc:${LVC[c.lv]}">${esc(c.lv)}</span></div>`; }
  function frontHtml(c){ return `${topRow(c)}<div class="mid"><div class="w">${c.t.map(t => esc(t[0])).join('<br>')}</div><div class="m">${c.t.map(t => esc(t[1])).join(' · ')}</div></div><div class="tap">Dokun: ayrıntı · kaydır: sıradaki</div>`; }
  function backHtml(c){
    const ex = (c.ex || []).map(e => `<div class="ex"><p class="jp">${kRuby(e[0])}</p><p class="tr">${esc(e[1])}</p></div>`).join('');
    return `<div class="bh"><span class="w">${c.t.map(t => esc(t[0])).join('・')}</span><span class="m">${c.t.map(t => esc(t[1])).join(' · ')}</span></div>
      ${c.use ? `<p class="use">${esc(c.use)}</p>` : ''}
      <ol class="rows">${c.rows.map((r, i) => `<li><span class="n">${i + 1}</span><div class="fm">${fmtF(r[0])}</div><span class="lb">${esc(r[1])}</span>${r[2] ? `<div class="tr">${esc(r[2])}</div>` : ''}</li>`).join('')}</ol>
      <div class="ksub">Örnekler</div>${ex}
      ${c.err ? `<div class="ksub">Sık yapılan hata</div><div class="err"><s>${esc(c.err[0])}</s> → <b>${esc(c.err[1])}</b><br><span style="color:var(--muted)">${esc(c.err[2])}</span></div>` : ''}
      ${c.r && c.r.length ? `<div class="ksub">İpuçları</div><ul class="rules">${c.r.map(r => `<li>${esc(r)}</li>`).join('')}</ul></div>` : ''}`;
  }
  function cardHtml(c, cls, cur){ return `<div class="card ${cls} ${catCls(c.cat)}" ${cur ? 'id="cur"' : 'aria-hidden="true"'}><div class="inner"><div class="face front">${frontHtml(c)}</div>${cur ? `<div class="face back">${topRow(c)}<div class="scroll"></div></div>` : ''}</div></div>`; }
  function render(enter){
    const st = $('stage');
    $('tot').textContent = deck.length; $('pos').textContent = deck.length ? pos + 1 : 0;
    $('dots').innerHTML = deck.length <= 60 ? deck.map((_, i) => `<i class="${i <= pos ? 'on' : ''}"></i>`).join('') : '';
    if (!deck.length){ st.innerHTML = '<div class="empty">Bu seviyede kalıp yok.</div>'; return; }
    const c = deck[pos], n1 = deck[(pos + 1) % deck.length], n2 = deck[(pos + 2) % deck.length];
    flipped = false;
    st.innerHTML = (deck.length > 2 ? cardHtml(n2, 'n2', false) : '') + (deck.length > 1 ? cardHtml(n1, 'n1', false) : '') + cardHtml(c, 'cur', true);
    const el = $('cur');
    if (enter && !reduce()){ el.classList.add('enter'); requestAnimationFrame(() => requestAnimationFrame(() => el.classList.remove('enter'))); }
    bindDrag(el);
  }
  function flip(){ const el = $('cur'); if (!el) return; flipped = !flipped; if (flipped){ const sc = el.querySelector('.scroll'); if (!sc.dataset.done){ sc.dataset.done = 1; sc.innerHTML = backHtml(deck[pos]); setTimeout(() => sc.classList.toggle('can', sc.scrollHeight > sc.clientHeight + 2), 60); } } el.classList.toggle('flipped', flipped); }
  function next(dx, dy){
    if (busy || !deck.length) return; const el = $('cur'); busy = true;
    const W = Math.max(innerWidth, 400), H = Math.max(innerHeight, 500);
    const ax = Math.abs(dx) >= Math.abs(dy);
    el.classList.remove('drag'); el.classList.add('fly');
    el.style.transform = ax ? `translate(${Math.sign(dx || 1) * W * 1.2}px, ${dy + 20}px) rotate(${Math.sign(dx || 1) * 22}deg)` : `translate(${dx * .3}px, ${Math.sign(dy || 1) * H}px) rotate(${dx / 30}deg)`;
    el.style.opacity = '0';
    setTimeout(() => {
      busy = false;
      if (pos + 1 >= deck.length){ round++; deck = shuffle(deck); pos = 0; render(true); toast(`Deste bitti · yeni karışık deste (${round}. tur)`); }
      else { pos++; render(true); }
    }, reduce() ? 0 : 230);
  }
  function setDrag(el, dx, dy){ el.style.transform = `translate(${dx}px, ${dy}px) rotate(${dx / 16}deg)`; }
  let lastDrag = 0;
  function bindDrag(el){
    let st = null;
    el.addEventListener('pointerdown', e => { if (e.button > 0 || busy) return; st = {x:e.clientX, y:e.clientY, t:performance.now(), id:e.pointerId, drag:false, sc:e.target.closest('.scroll')}; });
    el.addEventListener('pointermove', e => {
      if (!st || e.pointerId !== st.id) return; const dx = e.clientX - st.x, dy = e.clientY - st.y;
      if (!st.drag){ if (Math.hypot(dx, dy) < 10) return; const sc = st.sc; if (sc && Math.abs(dy) > Math.abs(dx) && sc.scrollHeight > sc.clientHeight + 2 && !(dy > 0 && sc.scrollTop <= 0) && !(dy < 0 && sc.scrollTop + sc.clientHeight >= sc.scrollHeight - 1)){ st = null; return; } st.drag = true; el.classList.add('drag'); try{ el.setPointerCapture(e.pointerId); }catch(_){} }
      e.preventDefault(); setDrag(el, dx, dy);
    });
    const end = e => { if (!st || e.pointerId !== st.id) return; const s = st; st = null; if (!s.drag) return; lastDrag = performance.now(); const dx = e.clientX - s.x, dy = e.clientY - s.y, dt = Math.max(1, performance.now() - s.t), v = Math.hypot(dx, dy) / dt, W = el.offsetWidth || 300; if (Math.hypot(dx, dy) > W * .26 || (v > .55 && Math.hypot(dx, dy) > 40)) next(dx, dy); else { el.classList.remove('drag'); el.style.transform = ''; } };
    el.addEventListener('pointerup', end);
    el.addEventListener('pointercancel', () => { if (st && st.drag){ el.classList.remove('drag'); el.style.transform = ''; } st = null; });
  }
  $('stage').addEventListener('click', e => { if (!e.target.closest('#cur')) return; if (performance.now() - lastDrag < 400) return; if (e.target.closest('button, a')) return; flip(); });
  $('mix').addEventListener('click', () => newDeck('Yeni karışık deste'));
  $('cat').addEventListener('change', e => { opt.cat = e.target.value; ls.set('opt', opt); newDeck(opt.cat === 'all' ? 'Tüm konular' : CATS[+opt.cat][1]); });
  $('lv').addEventListener('change', e => { opt.lv = e.target.value; ls.set('opt', opt); newDeck(opt.lv === 'all' ? 'Tüm seviyeler' : opt.lv + ' destesi'); });
  $('n').addEventListener('change', e => { opt.n = +e.target.value; ls.set('opt', opt); newDeck((opt.n || 'Tüm') + ' kart'); });
  document.addEventListener('keydown', e => {
    if (e.ctrlKey || e.metaKey || e.altKey || /input|select|textarea/i.test(e.target.tagName)) return;
    const k = e.key;
    if (k === 'ArrowRight' || k === 'ArrowLeft' || k === 'ArrowDown' || k === 'ArrowUp'){ e.preventDefault(); next(k === 'ArrowRight' ? 1 : k === 'ArrowLeft' ? -1 : 0, k === 'ArrowDown' ? 1 : k === 'ArrowUp' ? -1 : 0); }
    else if (k === ' ' || k === 'Enter'){ e.preventDefault(); flip(); }
    else if (k === 's' || k === 'S'){ newDeck('Yeni karışık deste'); }
  });
  newDeck();
})();
</script>

</body></html>
